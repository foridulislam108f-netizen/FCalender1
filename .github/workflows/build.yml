name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find or unzip project
        id: proj
        run: |
          f=$(find . -name settings.gradle -not -path "./.git/*" | head -n 1)
          if [ -z "$f" ]; then
            z=$(find . -maxdepth 2 -iname "*.zip" -not -path "./.git/*" | head -n 1)
            if [ -z "$z" ]; then
              echo "::error::না settings.gradle, না কোনো zip ফাইল পাওয়া গেছে।"
              exit 1
            fi
            mkdir -p _proj
            unzip -q "$z" -d _proj
            f=$(find _proj -name settings.gradle | head -n 1)
          fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FCalendar-apk
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
